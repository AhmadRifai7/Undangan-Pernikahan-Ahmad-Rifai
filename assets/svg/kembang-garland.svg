  <path d="M160 35 Q155 70 160 100" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M160 35 Q140 60 135 90" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.3"/>

