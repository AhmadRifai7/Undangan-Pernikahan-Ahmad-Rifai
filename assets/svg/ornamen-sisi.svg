<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 500" fill="none">
  <!-- Main vertical stem -->
  <path d="M80 0 Q85 125 80 250 Q75 375 80 500" stroke="#C5973A" stroke-width="1" opacity="0.4" fill="none"/>
  <path d="M80 0 Q78 125 80 250 Q82 375 80 500" stroke="#C5973A" stroke-width="0.4" opacity="0.2" fill="none"/>

  <!-- Branch tendrils left -->
  <path d="M80 80 Q55 70 30 80 Q20 88 15 100" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M80 160 Q50 145 25 155" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M80 250 Q48 238 22 248" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M80 340 Q52 328 28 338" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M80 420 Q55 410 30 420 Q20 428 15 440" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.35"/>

  <!-- Branch tendrils right -->
  <path d="M80 120 Q110 110 135 118" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M80 200 Q112 188 138 198" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M80 300 Q108 290 132 300" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M80 380 Q110 370 136 380" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.3"/>

  <!-- Melati flowers on stem -->
  <!-- Top flower -->
  <g transform="translate(80,30)" opacity="0.85">
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(60)"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(120)"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(180)"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(240)"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="4" fill="#E2B96F"/>
  </g>

  <!-- Middle left flower -->
  <g transform="translate(22,100)" opacity="0.7">
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(60)"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(120)"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(180)"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(240)"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="3" fill="#E2B96F"/>
  </g>

  <!-- Center large flower -->
  <g transform="translate(80,250)" opacity="0.9">
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F5EFE0" opacity="0.95"/>
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F5EFE0" opacity="0.95" transform="rotate(45)"/>
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F5EFE0" opacity="0.95" transform="rotate(90)"/>
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F5EFE0" opacity="0.95" transform="rotate(135)"/>
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F5EFE0" opacity="0.95" transform="rotate(180)"/>
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F5EFE0" opacity="0.95" transform="rotate(225)"/>
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F5EFE0" opacity="0.95" transform="rotate(270)"/>
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F5EFE0" opacity="0.95" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="5" fill="#E2B96F"/>
    <circle cx="0" cy="0" r="2" fill="#C5973A"/>
  </g>

  <!-- Right branch flower -->
  <g transform="translate(136,200)" opacity="0.65">
    <ellipse cx="0" cy="-7" rx="3.5" ry="6" fill="#F5EFE0" opacity="0.8"/>
    <ellipse cx="0" cy="-7" rx="3.5" ry="6" fill="#F5EFE0" opacity="0.8" transform="rotate(60)"/>
    <ellipse cx="0" cy="-7" rx="3.5" ry="6" fill="#F5EFE0" opacity="0.8" transform="rotate(120)"/>
    <ellipse cx="0" cy="-7" rx="3.5" ry="6" fill="#F5EFE0" opacity="0.8" transform="rotate(180)"/>
    <ellipse cx="0" cy="-7" rx="3.5" ry="6" fill="#F5EFE0" opacity="0.8" transform="rotate(240)"/>
    <ellipse cx="0" cy="-7" rx="3.5" ry="6" fill="#F5EFE0" opacity="0.8" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="2.5" fill="#E2B96F"/>
  </g>

  <!-- Lower flowers -->
  <g transform="translate(25,338)" opacity="0.65">
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(60)"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(120)"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(180)"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(240)"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#F5EFE0" opacity="0.85" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="3" fill="#E2B96F"/>
  </g>

  <g transform="translate(80,470)" opacity="0.8">
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(60)"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(120)"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(180)"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(240)"/>
    <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#F5EFE0" opacity="0.9" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="4" fill="#E2B96F"/>
  </g>

  <!-- Leaf shapes -->
  <ellipse cx="55" cy="155" rx="8" ry="4" fill="#C5973A" opacity="0.25" transform="rotate(-30 55 155)"/>
  <ellipse cx="112" cy="118" rx="7" ry="3.5" fill="#C5973A" opacity="0.2" transform="rotate(20 112 118)"/>
  <ellipse cx="50" cy="248" rx="7" ry="3.5" fill="#C5973A" opacity="0.25" transform="rotate(-25 50 248)"/>
  <ellipse cx="110" cy="300" rx="7" ry="3.5" fill="#C5973A" opacity="0.2" transform="rotate(15 110 300)"/>
  <ellipse cx="55" cy="420" rx="8" ry="4" fill="#C5973A" opacity="0.25" transform="rotate(-30 55 420)"/>

  <!-- Bud dots -->
  <circle cx="80" cy="130" r="3" fill="#E2B96F" opacity="0.4"/>
  <circle cx="80" cy="190" r="2" fill="#E2B96F" opacity="0.3"/>
  <circle cx="80" cy="310" r="3" fill="#E2B96F" opacity="0.4"/>
  <circle cx="80" cy="390" r="2" fill="#E2B96F" opacity="0.3"/>
</svg>
