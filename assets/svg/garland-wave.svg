<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" fill="none" aria-hidden="true">
  <!-- Gelombang utama atas -->
  <path d="M0 60 Q50 30 100 60 Q150 90 200 60 Q250 30 300 60 Q350 90 400 60 Q450 30 500 60 Q550 90 600 60 Q650 30 700 60 Q750 90 800 60"
    stroke="currentColor" stroke-width="0.7" opacity="0.25"/>
  <!-- Gelombang bawah lebih kecil -->
  <path d="M0 68 Q50 48 100 68 Q150 88 200 68 Q250 48 300 68 Q350 88 400 68 Q450 48 500 68 Q550 88 600 68 Q650 48 700 68 Q750 88 800 68"
    stroke="currentColor" stroke-width="0.4" opacity="0.12"/>

  <!-- Ornamen di puncak gelombang -->
  <g opacity="0.4">
    <!-- Puncak 1 -->
    <path d="M100 60 L103 54 L106 60 L103 66Z" fill="currentColor" opacity="0.5"/>
    <circle cx="100" cy="60" r="2.5" fill="currentColor" opacity="0.6"/>
    <!-- Puncak 2 -->
    <path d="M300 60 L303 54 L306 60 L303 66Z" fill="currentColor" opacity="0.5"/>
    <circle cx="300" cy="60" r="2.5" fill="currentColor" opacity="0.6"/>
    <!-- Puncak 3 - tengah, lebih besar -->
    <path d="M400 60 L404 52 L408 60 L404 68Z" fill="currentColor" opacity="0.6"/>
    <circle cx="400" cy="60" r="3.5" fill="currentColor" opacity="0.7"/>
    <circle cx="400" cy="60" r="1.5" fill="currentColor" opacity="0.9"/>
    <!-- Puncak 4 -->
    <path d="M500 60 L503 54 L506 60 L503 66Z" fill="currentColor" opacity="0.5"/>
    <circle cx="500" cy="60" r="2.5" fill="currentColor" opacity="0.6"/>
    <!-- Puncak 5 -->
    <path d="M700 60 L703 54 L706 60 L703 66Z" fill="currentColor" opacity="0.5"/>
    <circle cx="700" cy="60" r="2.5" fill="currentColor" opacity="0.6"/>
  </g>

  <!-- Ornamen di lembah gelombang -->
  <g opacity="0.25">
    <circle cx="200" cy="60" r="1.5" fill="currentColor"/>
    <circle cx="600" cy="60" r="1.5" fill="currentColor"/>
  </g>

  <!-- Sulur kecil di tengah atas -->
  <g transform="translate(400,28)">
    <path d="M0 0 C-8-5 -18-4 -22-8" stroke="currentColor" stroke-width="0.6" opacity="0.2"/>
    <path d="M0 0 C8-5 18-4 22-8" stroke="currentColor" stroke-width="0.6" opacity="0.2"/>
    <path d="M-22-8 C-26-12 -24-16 -20-14" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
    <path d="M22-8 C26-12 24-16 20-14" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
    <!-- Bunga kecil tengah atas -->
    <circle cx="0" cy="0" r="4" fill="currentColor" opacity="0.3"/>
    <path d="M0-8 C1-5 1-3 0-1 C-1-3 -1-5 0-8Z" fill="currentColor" opacity="0.25"/>
    <path d="M0 8 C-1 5 -1 3 0 1 C1 3 1 5 0 8Z" fill="currentColor" opacity="0.25"/>
    <path d="M-8 0 C-5-1 -3-1 -1 0 C-3 1 -5 1 -8 0Z" fill="currentColor" opacity="0.25"/>
    <path d="M8 0 C5 1 3 1 1 0 C3-1 5-1 8 0Z" fill="currentColor" opacity="0.25"/>
  </g>

  <!-- Titik aksen sepanjang garland -->
  <g opacity="0.18">
    <circle cx="50" cy="44" r="1" fill="currentColor"/>
    <circle cx="150" cy="76" r="1" fill="currentColor"/>
    <circle cx="250" cy="44" r="1" fill="currentColor"/>
    <circle cx="350" cy="76" r="1" fill="currentColor"/>
    <circle cx="450" cy="76" r="1" fill="currentColor"/>
    <circle cx="550" cy="44" r="1" fill="currentColor"/>
    <circle cx="650" cy="76" r="1" fill="currentColor"/>
    <circle cx="750" cy="44" r="1" fill="currentColor"/>
  </g>
</svg>
