<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" aria-hidden="true">
  <!-- Corner ornament - top left -->
  
  <!-- Garis border L-shape -->
  <path d="M10 150 L10 10 L150 10" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <path d="M18 150 L18 18 L150 18" stroke="currentColor" stroke-width="0.4" opacity="0.2"/>
  
  <!-- Ornamen sudut -->
  <path d="M10 10 L22 10 L10 22Z" fill="currentColor" opacity="0.3"/>
  <circle cx="10" cy="10" r="4" fill="currentColor" opacity="0.5"/>
  <circle cx="10" cy="10" r="2" fill="currentColor" opacity="0.8"/>
  
  <!-- Diamond aksen di garis -->
  <path d="M10 40 L14 36 L18 40 L14 44Z" fill="currentColor" opacity="0.35"/>
  <path d="M10 80 L14 76 L18 80 L14 84Z" fill="currentColor" opacity="0.35"/>
  <path d="M40 10 L44 14 L40 18 L36 14Z" fill="currentColor" opacity="0.35"/>
  <path d="M80 10 L84 14 L80 18 L76 14Z" fill="currentColor" opacity="0.35"/>
  
  <!-- Sulur floral dari sudut -->
  <path d="M10 10 Q30 20 40 40 Q45 55 38 65" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <path d="M10 10 Q20 30 40 40 Q55 45 65 38" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  
  <!-- Daun kecil di sulur -->
  <path d="M28 28 C25 22 30 18 34 22 C30 26 28 28 28 28Z" fill="currentColor" opacity="0.2"/>
  <path d="M28 28 C22 25 18 30 22 34 C26 30 28 28 28 28Z" fill="currentColor" opacity="0.2"/>
  
  <!-- Bunga di ujung sulur -->
  <g transform="translate(50,50)">
    <circle cx="0" cy="0" r="6" fill="currentColor" opacity="0.25"/>
    <path d="M0-10 C2-6 2-3 0-1 C-2-3 -2-6 0-10Z" fill="currentColor" opacity="0.3"/>
    <path d="M0 10 C-2 6 -2 3 0 1 C2 3 2 6 0 10Z" fill="currentColor" opacity="0.3"/>
    <path d="M-10 0 C-6-2 -3-2 -1 0 C-3 2 -6 2 -10 0Z" fill="currentColor" opacity="0.3"/>
    <path d="M10 0 C6 2 3 2 1 0 C3-2 6-2 10 0Z" fill="currentColor" opacity="0.3"/>
    <circle cx="0" cy="0" r="2.5" fill="currentColor" opacity="0.6"/>
  </g>
  
  <!-- Titik aksen -->
  <circle cx="10" cy="120" r="1.5" fill="currentColor" opacity="0.3"/>
  <circle cx="120" cy="10" r="1.5" fill="currentColor" opacity="0.3"/>
</svg>
