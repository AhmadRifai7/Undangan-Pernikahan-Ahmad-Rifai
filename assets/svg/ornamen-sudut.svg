<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none">
  <!-- Outer border lines -->
  <path d="M0 0 L180 0" stroke="#C5973A" stroke-width="1" opacity="0.6"/>
  <path d="M0 0 L0 180" stroke="#C5973A" stroke-width="1" opacity="0.6"/>
  <path d="M20 20 L160 20" stroke="#C5973A" stroke-width="0.5" opacity="0.4"/>
  <path d="M20 20 L20 160" stroke="#C5973A" stroke-width="0.5" opacity="0.4"/>

  <!-- Corner jewel -->
  <circle cx="0" cy="0" r="6" fill="#C5973A" opacity="0.8"/>
  <circle cx="0" cy="0" r="10" stroke="#C5973A" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- Decorative diamond chain horizontal -->
  <g opacity="0.7">
    <rect x="30" y="-3" width="6" height="6" fill="#C5973A" transform="rotate(45 33 0)"/>
    <rect x="55" y="-3" width="5" height="5" fill="#C5973A" opacity="0.5" transform="rotate(45 58 0)"/>
    <rect x="78" y="-3" width="6" height="6" fill="#C5973A" transform="rotate(45 81 0)"/>
    <rect x="101" y="-3" width="5" height="5" fill="#C5973A" opacity="0.5" transform="rotate(45 104 0)"/>
    <rect x="124" y="-3" width="6" height="6" fill="#C5973A" transform="rotate(45 127 0)"/>
    <rect x="147" y="-3" width="5" height="5" fill="#C5973A" opacity="0.5" transform="rotate(45 150 0)"/>
  </g>

  <!-- Decorative diamond chain vertical -->
  <g opacity="0.7">
    <rect x="-3" y="30" width="6" height="6" fill="#C5973A" transform="rotate(45 0 33)"/>
    <rect x="-3" y="53" width="5" height="5" fill="#C5973A" opacity="0.5" transform="rotate(45 0 56)"/>
    <rect x="-3" y="76" width="6" height="6" fill="#C5973A" transform="rotate(45 0 79)"/>
    <rect x="-3" y="99" width="5" height="5" fill="#C5973A" opacity="0.5" transform="rotate(45 0 102)"/>
    <rect x="-3" y="122" width="6" height="6" fill="#C5973A" transform="rotate(45 0 125)"/>
    <rect x="-3" y="145" width="5" height="5" fill="#C5973A" opacity="0.5" transform="rotate(45 0 148)"/>
  </g>

  <!-- Floral motif - rose/jasmine cluster -->
  <g transform="translate(60, 60)" opacity="0.85">
    <!-- Main flower center -->
    <circle cx="0" cy="0" r="5" fill="#E2B96F"/>
    <!-- Petals -->
    <ellipse cx="0" cy="-14" rx="5" ry="9" fill="#C5973A" opacity="0.8" transform="rotate(0)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="9" fill="#C5973A" opacity="0.8" transform="rotate(45)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="9" fill="#C5973A" opacity="0.8" transform="rotate(90)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="9" fill="#C5973A" opacity="0.8" transform="rotate(135)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="9" fill="#C5973A" opacity="0.8" transform="rotate(180)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="9" fill="#C5973A" opacity="0.8" transform="rotate(225)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="9" fill="#C5973A" opacity="0.8" transform="rotate(270)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="9" fill="#C5973A" opacity="0.8" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="4" fill="#E2B96F"/>

    <!-- Small side buds -->
    <g transform="translate(-22,-18)">
      <circle cx="0" cy="0" r="3" fill="#E2B96F" opacity="0.6"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5" transform="rotate(90)"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5" transform="rotate(180)"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5" transform="rotate(270)"/>
    </g>
    <g transform="translate(22,-18)">
      <circle cx="0" cy="0" r="3" fill="#E2B96F" opacity="0.6"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5" transform="rotate(90)"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5" transform="rotate(180)"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5" transform="rotate(270)"/>
    </g>
    <g transform="translate(0, 30)">
      <circle cx="0" cy="0" r="3" fill="#E2B96F" opacity="0.6"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5" transform="rotate(120)"/>
      <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#C5973A" opacity="0.5" transform="rotate(240)"/>
    </g>

    <!-- Vine / leaf tendrils -->
    <path d="M-8 8 Q-20 20 -32 18 Q-28 10 -20 14 Q-12 18 -8 8Z" fill="#C5973A" opacity="0.4"/>
    <path d="M8 8 Q18 22 14 34 Q8 28 10 20 Q12 12 8 8Z" fill="#C5973A" opacity="0.4"/>
    <path d="M-5 10 Q-10 30 -25 38" stroke="#C5973A" stroke-width="1" fill="none" opacity="0.35"/>
    <path d="M5 10 Q12 28 8 44" stroke="#C5973A" stroke-width="1" fill="none" opacity="0.35"/>
  </g>

  <!-- Secondary smaller flower near origin -->
  <g transform="translate(22, 22)" opacity="0.6">
    <circle cx="0" cy="0" r="3" fill="#E2B96F"/>
    <ellipse cx="0" cy="-9" rx="3.5" ry="6" fill="#C5973A" opacity="0.7"/>
    <ellipse cx="0" cy="-9" rx="3.5" ry="6" fill="#C5973A" opacity="0.7" transform="rotate(60)"/>
    <ellipse cx="0" cy="-9" rx="3.5" ry="6" fill="#C5973A" opacity="0.7" transform="rotate(120)"/>
    <ellipse cx="0" cy="-9" rx="3.5" ry="6" fill="#C5973A" opacity="0.7" transform="rotate(180)"/>
    <ellipse cx="0" cy="-9" rx="3.5" ry="6" fill="#C5973A" opacity="0.7" transform="rotate(240)"/>
    <ellipse cx="0" cy="-9" rx="3.5" ry="6" fill="#C5973A" opacity="0.7" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="2.5" fill="#E2B96F"/>
  </g>

  <!-- Dotted accent trail -->
  <g opacity="0.3">
    <circle cx="95" cy="8" r="1.5" fill="#C5973A"/>
    <circle cx="105" cy="8" r="1" fill="#C5973A"/>
    <circle cx="113" cy="8" r="1.5" fill="#C5973A"/>
    <circle cx="8" cy="95" r="1.5" fill="#C5973A"/>
    <circle cx="8" cy="107" r="1" fill="#C5973A"/>
    <circle cx="8" cy="117" r="1.5" fill="#C5973A"/>
  </g>
</svg>
