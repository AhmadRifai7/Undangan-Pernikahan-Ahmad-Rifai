    <circle cx="0" cy="0" r="16" stroke="currentColor" stroke-width="0.4" opacity="0.15"/>

    <!-- Titik aksen di ring -->
    <circle cx="0" cy="-22" r="1.5" fill="currentColor" opacity="0.35"/>
    <circle cx="0" cy="22" r="1.5" fill="currentColor" opacity="0.35"/>
