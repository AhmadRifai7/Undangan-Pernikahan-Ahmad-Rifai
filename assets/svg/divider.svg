<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" fill="none">
  <!-- Left line -->
  <path d="M0 20 Q60 20 90 20" stroke="#C5973A" stroke-width="0.8" opacity="0.5"/>
  <path d="M0 20 Q60 18 90 20" stroke="#C5973A" stroke-width="0.3" opacity="0.3"/>

  <!-- Left small diamonds -->
  <rect x="30" y="17" width="6" height="6" fill="#C5973A" opacity="0.4" transform="rotate(45 33 20)"/>
  <rect x="55" y="17.5" width="5" height="5" fill="#C5973A" opacity="0.3" transform="rotate(45 57.5 20)"/>
  <rect x="78" y="17.5" width="5" height="5" fill="#C5973A" opacity="0.5" transform="rotate(45 80.5 20)"/>

  <!-- Center floral motif -->
  <g transform="translate(200,20)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="14" stroke="#C5973A" stroke-width="0.6" fill="none" opacity="0.3"/>
    <!-- Petals -->
    <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#C5973A" opacity="0.6"/>
    <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#C5973A" opacity="0.6" transform="rotate(45)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#C5973A" opacity="0.6" transform="rotate(90)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#C5973A" opacity="0.6" transform="rotate(135)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#C5973A" opacity="0.6" transform="rotate(180)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#C5973A" opacity="0.6" transform="rotate(225)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#C5973A" opacity="0.6" transform="rotate(270)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#C5973A" opacity="0.6" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="4" fill="#E2B96F"/>
    <circle cx="0" cy="0" r="1.5" fill="#C5973A"/>

    <!-- Small flanking diamonds -->
    <rect x="17" y="-3" width="6" height="6" fill="#C5973A" opacity="0.5" transform="rotate(45 20 0)"/>
    <rect x="-23" y="-3" width="6" height="6" fill="#C5973A" opacity="0.5" transform="rotate(45 -20 0)"/>
  </g>

  <!-- Right line -->
  <path d="M310 20 Q340 20 400 20" stroke="#C5973A" stroke-width="0.8" opacity="0.5"/>
  <path d="M310 20 Q340 22 400 20" stroke="#C5973A" stroke-width="0.3" opacity="0.3"/>

  <!-- Right small diamonds -->
  <rect x="314" y="17.5" width="5" height="5" fill="#C5973A" opacity="0.5" transform="rotate(45 316.5 20)"/>
  <rect x="338" y="17.5" width="5" height="5" fill="#C5973A" opacity="0.3" transform="rotate(45 340.5 20)"/>
  <rect x="362" y="17" width="6" height="6" fill="#C5973A" opacity="0.4" transform="rotate(45 365 20)"/>
</svg>
